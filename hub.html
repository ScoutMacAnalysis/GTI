<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Traceability Alignment Hub</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@500;600;700;800&family=Public+Sans:wght@400;500;600&family=Red+Hat+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky header with tabs and filter bar; one content column of cards and lists below */
:root{
  --bg:#F5F7F6; --surface:#FFFFFF; --sunk:#EDF1EF; --ink:#000000; --muted:#4E5752; --line:#D9DFDB;
  --brand:#00BF63; --accent:#007A40; --accent-ink:#000000; --accent-soft:#D9F6E7;
  --warn:#9A5B0C; --warn-soft:#F6E9D4; --crit:#A3343F; --crit-soft:#F6DFE1; --info:#2F3A6E; --info-soft:#E4E7F2;
  --logo-l:inline-block; --logo-d:none;
  --display:"Red Hat Display","Helvetica Neue",Arial,sans-serif;
  --body:"Public Sans","Segoe UI",system-ui,sans-serif;
  --mono:"Red Hat Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --surface:#0D0F0E; --sunk:#151917; --ink:#FFFFFF; --muted:#A3ADA8; --line:#27302B;
  --brand:#00BF63; --accent:#00BF63; --accent-ink:#000000; --accent-soft:#0B3320; --logo-l:none; --logo-d:inline-block;
  --warn:#E2AA4C; --warn-soft:#3A2D16; --crit:#EF8A93; --crit-soft:#3C2023; --info:#9AA8EC; --info-soft:#232A47; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#0D0F0E; --sunk:#151917; --ink:#FFFFFF; --muted:#A3ADA8; --line:#27302B;
  --brand:#00BF63; --accent:#00BF63; --accent-ink:#000000; --accent-soft:#0B3320; --logo-l:none; --logo-d:inline-block;
  --warn:#E2AA4C; --warn-soft:#3A2D16; --crit:#EF8A93; --crit-soft:#3C2023; --info:#9AA8EC; --info-soft:#232A47; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.inner{max-width:1100px;margin:0 auto}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:22px;font-weight:700} h2{font-size:19px;font-weight:600} h3{font-size:15.5px;font-weight:600}
p{margin:0}
a{color:var(--accent)}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
.small{font-size:13px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding-block:14px 8px}
.brand .tag{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--warn-soft);color:var(--warn)}
.brand .sub{flex-basis:100%;color:var(--muted);font-size:13.5px}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{padding:9px 12px;text-decoration:none;color:var(--muted);font-weight:500;font-size:14px;border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs a[aria-current="page"]{color:var(--ink);border-bottom:3px solid var(--brand);padding-bottom:8px}
.logo{display:inline-flex;align-items:center;gap:9px;border:3px solid var(--brand);padding:5px 11px 5px 8px;text-decoration:none;color:var(--ink);flex:none}
.logo img{width:34px;height:34px}
.logo .lg-l{display:var(--logo-l)} .logo .lg-d{display:var(--logo-d)}
.wm{display:flex;flex-direction:column;font-family:var(--display);font-weight:800;font-size:14px;line-height:.92;letter-spacing:.01em}
.wm i{font-style:normal;font-family:var(--body);font-weight:500;font-size:8px;letter-spacing:.34em;margin-top:3px}
h1{font-weight:800}
nav.tabs a .ct{font-family:var(--mono);font-size:11px;margin-left:5px;color:var(--muted)}

.filterbar{background:var(--sunk);border-bottom:1px solid var(--line)}
.filterbar .row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding-block:9px}
.fbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:13.5px}
.fbtn .n{font-family:var(--mono);font-size:11px;background:var(--brand);color:var(--accent-ink);border-radius:999px;padding:0 6px;min-width:18px;text-align:center}
.fbtn[aria-expanded="true"]{border-color:var(--accent)}
.search{flex:1 1 180px;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 10px;font-size:13.5px}
.clear{background:none;border:0;color:var(--accent);cursor:pointer;font-size:13px;padding:4px}
.fpanel{padding-bottom:12px;display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--accent-ink)}

main{padding-block:22px 64px}
.view{display:flex;flex-direction:column;gap:18px}
.vhead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px}
.vhead p{max-width:70ch}
.notice{font-size:13.5px;padding:9px 12px;border-radius:8px;background:var(--info-soft);color:var(--info)}
.notice.warn{background:var(--warn-soft);color:var(--warn)}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.gridreg{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel .ph{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.panel .ph a{font-size:13px}
.stats{display:flex;flex-wrap:wrap;gap:10px}
.stat{flex:1 1 140px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.stat b{display:block;font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}

.list{display:flex;flex-direction:column}
.item{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line);min-width:0}
.item:first-child{border-top:0;padding-top:2px}
.item .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.item .title{font-weight:600}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12.5px;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.t{font-size:11.5px;padding:1px 7px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill{font-family:var(--mono);font-size:11px;padding:2px 8px;border-radius:999px;white-space:nowrap;border:1px solid currentColor}
.pill.live{color:var(--accent)} .pill.pending{color:var(--warn)} .pill.proposed{color:var(--info)} .pill.seed{color:var(--muted);border-style:dashed}
.date{font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.when{flex:none;width:96px;display:flex;flex-direction:column;gap:2px}
.when b{font-family:var(--mono);font-size:12.5px;font-weight:500;font-variant-numeric:tabular-nums}
.when span{font-size:11.5px;color:var(--muted)}
.when.soon b{color:var(--crit)}
.vote{flex:none;width:52px;display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;padding:6px 0;height:max-content}
.vote b{font-family:var(--mono);font-size:15px;font-variant-numeric:tabular-nums}
.vote span{font-size:10.5px;color:var(--muted)}
.vote[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--brand)}
.vote:disabled{cursor:default;opacity:.7}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.lnk{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-size:13px}
.lnk.danger{color:var(--crit)}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.kv{display:grid;grid-template-columns:96px 1fr;gap:3px 10px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0}
.updates{border-top:1px dashed var(--line);padding-top:8px;display:flex;flex-direction:column;gap:6px;font-size:13px}

details.add{background:var(--surface);border:1px solid var(--line);border-radius:10px}
details.add>summary{cursor:pointer;padding:12px 16px;font-weight:600;list-style:none;display:flex;align-items:center;gap:8px;color:var(--accent)}
details.add>summary::-webkit-details-marker{display:none}
details.add>summary::before{content:"+";font-family:var(--mono);font-size:16px}
details.add[open]>summary::before{content:"\2212"}
form.f{padding:0 16px 16px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
form.f .full{grid-column:1/-1}
form.f label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
form.f input,form.f select,form.f textarea{border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:var(--bg);font-size:14px;width:100%}
form.f textarea{min-height:76px;resize:vertical}
fieldset.tagpick{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:5px;min-width:0}
fieldset.tagpick legend{font-size:13px;color:var(--muted);padding:0;margin-bottom:4px}
fieldset.tagpick .opts{display:flex;flex-wrap:wrap;gap:5px}
.btn{background:var(--brand);color:var(--accent-ink);border:0;border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer}
.btn:disabled{opacity:.5;cursor:default}
.err{color:var(--crit);font-size:13px}
.ok{color:var(--accent);font-size:13px}

.timeline{display:flex;flex-direction:column;gap:0;border-left:2px solid var(--line);margin-left:6px}
.tl{position:relative;padding:6px 0 10px 18px}
.tl::before{content:"";position:absolute;left:-7px;top:11px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--line)}
.tl.next::before{background:var(--brand);border-color:var(--brand)}
.tl.past{opacity:.6}
.tl .d{font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums}
.tl .l{font-size:14px}
.imap{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr) minmax(0,1.35fr) minmax(0,1fr) minmax(0,.9fr);gap:12px;align-items:stretch}
.mcol{display:flex;flex-direction:column;gap:8px;justify-content:center;min-width:0}
.mh{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:center;margin-bottom:2px}
.mthemes{background:var(--accent-soft);border-radius:18px;padding:12px 10px}
.musers{background:var(--ink);border-radius:18px;padding:12px 10px}
.musers .mh{color:var(--bg);opacity:.8}
.mnode,.mprod,.mcomm{font:inherit;color:var(--ink);cursor:pointer;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px}
.mnode{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 12px;font-size:13px;font-weight:600}
.mnode .mc{font-family:var(--mono);font-size:10.5px;font-weight:400;color:var(--muted)}
.mnode.user{background:transparent;color:var(--bg);border-color:var(--muted);padding:16px 10px}
.mprod{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 8px;font-size:12.5px;display:block}
.mprod .mc{font-family:var(--mono);font-size:10.5px;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:0 6px}
.mprod .ar{color:var(--brand);font-weight:700}
.mprod.gap{border-style:dashed;color:var(--muted);background:transparent}
.mprod .gp{font-family:var(--mono);font-size:10px;color:var(--warn);text-transform:uppercase;letter-spacing:.05em}
.mcomm{border:1px solid var(--line);background:var(--sunk);border-radius:50%;padding:26px 18px;min-height:118px;justify-content:center;font-weight:700;font-family:var(--display);font-size:15px}
.mcomm.cross{border-radius:999px;min-height:0;padding:12px 14px;font-size:13px;border-style:dashed;background:transparent}
.mcomm .mc{font-family:var(--mono);font-size:11px;font-weight:400;color:var(--muted)}
.mchips{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;margin-top:3px}
.mchips i{font-style:normal;font-family:var(--body);font-weight:400;font-size:10.5px;background:var(--surface);border-radius:999px;padding:0 6px;color:var(--muted)}
.mnode[aria-pressed="true"],.mprod[aria-pressed="true"],.mcomm[aria-pressed="true"]{outline:3px solid var(--brand);outline-offset:1px}
.mnode:hover,.mprod:hover,.mcomm:hover{border-color:var(--brand)}
.mband{display:flex;justify-content:space-between;background:var(--ink);color:var(--bg);font-family:var(--display);font-weight:700;font-size:13px;padding:8px 16px;border-radius:6px;margin-top:-6px}
.mdetail{scroll-margin-top:16px}
.mdetail h3.sub3{font-size:13.5px;margin:4px 0 6px;color:var(--muted)}
.mgroup{display:flex;flex-direction:column;gap:4px;padding:6px 0;border-top:1px solid var(--line)}
.mgroup:first-child{border-top:0}
@media (max-width:900px){.imap{grid-template-columns:1fr}.mcomm{border-radius:18px;min-height:0;padding:14px}.mband{margin-top:0}}
.svwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.imapsvg{display:block;width:100%;min-width:880px;height:auto;font-family:var(--body)}
.sv-lpanel{fill:var(--accent-soft)} .sv-rpanel{fill:var(--ink)}
.sv-ph{fill:var(--ink);font-size:16px} .sv-rph{fill:var(--bg);font-size:17px}
.sv-h{fill:var(--ink);font-family:var(--display);font-weight:800;font-size:19px}
.sv-theme{fill:var(--surface);stroke:var(--line);stroke-width:1}
.sv-tl{fill:var(--ink);font-size:14px;font-weight:600} .sv-tc{fill:var(--muted);font-family:var(--mono);font-size:11px}
.sv-prod{fill:var(--surface);stroke:var(--ink);stroke-width:1} .sv-prod.sv-in{fill:var(--accent-soft)}
.sv-prod.sv-gap{fill:none;stroke:var(--muted);stroke-dasharray:5 4}
.sv-pl{fill:var(--ink);font-size:13.5px} .sv-pc{fill:var(--accent);font-family:var(--mono);font-size:10.5px} .sv-gapt{fill:var(--warn);text-transform:uppercase;letter-spacing:.06em}
.sv-comm{fill:var(--sunk);stroke:var(--line);stroke-width:1} .sv-cross{fill:none;stroke:var(--muted);stroke-dasharray:5 4}
.sv-cl{fill:var(--ink);font-family:var(--display);font-weight:700;font-size:18px} .sv-cl2{fill:var(--ink);font-weight:600;font-size:13.5px}
.sv-chip{fill:var(--muted);font-size:11.5px}
.sv-user{fill:none;stroke:var(--bg);stroke-opacity:.55;stroke-width:1.2} .sv-ul{fill:var(--bg);font-size:14px;font-weight:600}
.sv-arr{stroke:var(--ink);stroke-width:2;stroke-dasharray:2 4;stroke-linecap:round} .sv-head{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sv-band{fill:var(--ink)} .sv-bt{fill:var(--bg);font-family:var(--display);font-weight:700;font-size:15px}
.sv-click{cursor:pointer} .sv-click:hover rect,.sv-click:hover ellipse{stroke:var(--brand);stroke-width:2;stroke-opacity:1}
.sv-click:focus{outline:none} .sv-click:focus-visible rect,.sv-click:focus-visible ellipse{stroke:var(--brand);stroke-width:3;stroke-opacity:1}
.sv-on{stroke:var(--brand)!important;stroke-width:3.5!important;stroke-opacity:1!important;stroke-dasharray:none!important}
.svhint{font-size:12.5px;color:var(--muted)}
@media (min-width:900px){.svhint{display:none}}
.tablewrap{overflow-x:auto}
table.matrix{border-collapse:collapse;width:100%;font-size:13px;min-width:560px}
table.matrix th,table.matrix td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.matrix thead th{font-family:var(--mono);font-size:11px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
table.matrix tbody th{font-weight:600}
table.matrix td.num{text-align:center;font-family:var(--mono);font-variant-numeric:tabular-nums;width:11%}
table.matrix td.has{background:var(--accent-soft);font-weight:600}
table.matrix tr.gap th{color:var(--crit)}
table.matrix tr.thin th{color:var(--warn)}
table.ftable{min-width:760px}
ul.tree{list-style:none;margin:6px 0 0;padding-left:22px;border-left:1px dashed var(--line);display:flex;flex-direction:column;gap:8px}
ul.tree.root{padding-left:0;border-left:0;margin:0}
.pnode{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
ul.tree ul.tree>li>.pnode>span:first-child::before{content:"\21B3\00a0";color:var(--muted)}
.pnode .title{font-weight:600}
.pollb{color:var(--accent);font-weight:600}
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px;font-size:14px}
footer.about{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px;display:flex;flex-direction:column;gap:6px}

@media (max-width:760px){
  .grid2,.grid2.gridreg{grid-template-columns:1fr}
  form.f{grid-template-columns:1fr}
  .when{width:78px}
  header.top{position:static}
}
@media (prefers-reduced-motion:no-preference){ .item,.card{transition:background .15s} }
</style>

</head>
<body>
<header class="top">
  <div class="gut"><div class="inner">
    <div class="brand">
      <h1>Traceability Alignment Hub</h1>
      <span class="tag">Prototype</span>
      <p class="sub">The shared base for building interoperable supply-chain data: see what already exists and build on it, tackle shared hurdles together, follow the rules that are coming, and show funders what their money is moving.</p>

</header>
<div class="filterbar"><div class="gut"><div class="inner">

    <button class="fbtn" id="fb-commodity" aria-expanded="false" aria-controls="fpanel">Commodity <span class="n" hidden></span></button>

    <button class="clear" id="clearf" hidden>Clear filters</button>
  </div>
  <div class="fpanel" id="fpanel" hidden></div>
</div></div></div>

ng or owner.", "example": true, "regions": [], "sectors": [], "source": "Comments on the working documents", "title": "Event data and verifiable credentials have no agreed bridge", "id": "h-twomodels"}, {"category": "Incentives and business case", "commodities": [], "createdBy": "curated", "detail": "Organisations often take advice from vendors whose revenue depends on keeping data in their own system.", "example": true, "regions": [], "sectors": [], "source": "Forum roadmap", "title": "Some solution providers' business models resist interoperability", "id": "h-vendors"}, {"category": "Identifiers and technical fit", "commodities": [], "createdBy": "curated", "detail": "Plot boundaries, geolocation and farm records are captured in different ways by different tools.", "example": true, "poll": {"n": 56, "q": "Most critical barriers to interoperability for EUDR outcomes", "score": 10}, "regions": [], "sectors": [], "source": "Stakeholder poll", "theme": "Technical standards", "title": "No common data standards or formats for field data", "id": "p-fieldstandards"}, {"category": "Producer-country capacity", "commodities": [], "createdBy": "curated", "detail": "Asked where EUDR data flow breaks down most (two choices each), 34 of 52 respondents picked farm level and 24 picked aggregators and cooperatives. No other stage scored above 13.", "example": true, "poll": {"n": 52, "q": "Biggest breakdown in the flow and usability of EUDR data", "score": 34}, "regions": [], "sectors": ["Agri-food", "Forestry"], "source": "Stakeholder poll", "theme": "Participation in governance", "title": "Data breaks down at farm and cooperative level", "id": "p-firstmile"}, {"category": "Regulation", "commodities": [], "createdBy": "curated", "detail": "Land tenure, permits and national legal frameworks differ, and there is no shared view of what evidence is enough.", "example": true, "poll": {"n": 56, "q": "Most critical barriers to interoperability for EUDR outcomes", "score": 12}, "regions": [], "sectors": ["Agri-food", "Forestry"], "source": "Stakeholder poll", "theme": "Verification and assurance", "title": "No standard evidence requirements for legality compliance", "id": "p-legality"}, {"category": "Producer-country capacity", "commodities": [], "createdBy": "curated", "detail": "Producer-country systems and company or EU systems run in parallel, so data is collected twice.", "example": true, "poll": {"n": 56, "q": "Most critical barriers to interoperability for EUDR outcomes", "score": 13}, "regions": [], "sectors": [], "source": "Stakeholder poll", "theme": "Technical standards", "title": "National traceability systems aren't integrated with other systems", "id": "p-national"}, {"category": "Identifiers and technical fit", "commodities": [], "createdBy": "curated", "detail": "There is no agreed way to request, send and receive data between systems, even where formats are similar.", "example": true, "poll": {"n": 56, "q": "Most critical barriers to interoperability for EUDR outcomes", "score": 19}, "regions": [], "sectors": [], "source": "Stakeholder poll", "theme": "Technical standards", "title": "No common data-sharing protocols", "id": "p-protocols"}, {"category": "Regulation", "commodities": [], "createdBy": "curated", "detail": "Satellite data, cut-off dates and mitigation methods vary, so the same plot can be judged differently.", "example": true, "poll": {"n": 56, "q": "Most critical barriers to interoperability for EUDR outcomes", "score": 12}, "regions": [], "sectors": ["Agri-food", "Forestry"], "source": "Stakeholder poll", "theme": "Verification and assurance", "title": "No standard datasets or methods for assessing deforestation risk", "id": "p-riskmethods"}, {"category": "Identifiers and technical fit", "commodities": [], "createdBy": "curated", "detail": "Transaction and shipment data is held in different structures, so it can't be passed along cleanly.", "example": true, "poll": {"n": 56, "q": "Most critical barriers to interoperability for EUDR outcomes", "score": 11}, "regions": [], "sectors": [], "source": "Stakeholder poll", "theme": "Technical standards", "title": "No common data standards or formats for supply-chain data", "id": "p-scstandards"}, {"category": "Lock-in to existing systems", "commodities": [], "createdBy": "curated", "detail": "Tools across the supply chain don't connect, so data has to be re-entered or re-collected at each step.", "example": true, "poll": {"n": 56, "q": "Most critical barriers to interoperability for EUDR outcomes", "score": 23}, "regions": [], "sectors": [], "source": "Stakeholder poll", "theme": "Technical standards", "title": "Traceability tools and platforms are incompatible or siloed", "id": "p-siloed"}, {"category": "Governance and data rights", "commodities": [], "createdBy": "curated", "detail": "National data laws and sovereignty concerns restrict what can be shared across borders.", "example": true, "poll": {"n": 56, "q": "Most critical barriers to interoperability for EUDR outcomes", "score": 8}, "regions": [], "sectors": [], "source": "Stakeholder poll", "theme": "Privacy and trust", "title": "Legal or data-sovereignty limits on sharing data", "id": "p-sovereignty"}, {"category": "Governance and data rights", "commodities": [], "createdBy": "curated", "detail": "Actors hold back data because they fear misuse or see no return for sharing it.", "example": true, "poll": {"n": 56, "q": "Most critical barriers to interoperability for EUDR outcomes", "score": 15}, "regions": [], "sectors": [], "source": "Stakeholder poll", "theme": "Privacy and trust", "title": "Low trust or incentive to share data between supply-chain actors", "id": "p-trust"}, {"category": "Regulation", "commodities": [], "createdBy": "curated", "detail": "Without volume reconciliation, compliant and non-compliant product can mix along the chain.", "example": true, "poll": {"n": 56, "q": "Most critical barriers to interoperability for EUDR outcomes", "score": 3}, "regions": [], "sectors": [], "source": "Stakeholder poll", "theme": "Verification and assurance", "title": "No effective way to control volumes, prevent mixing and verify", "id": "p-volume"}], "ideas": []};</script>
<script>
(function(){
"use strict";
var SECTORS=["Agri-food","Seafood","Forestry","Textiles and leather","Batteries and minerals","Cross-sector"];
var REGIONS=["Global","EU","UK","North America","South America","Africa","Asia-Pacific"];
var COMMODITIES=["Cattle","Leather","Cocoa","Coffee","Palm oil","Rubber","Soy","Timber and pulp","Seafood","Cotton","Battery minerals"];
var TYPES=["Standard","Platform or tool","National system","Pilot","Convening body"];
var STAGES=["Concept","In development","Pilot","Live","Scaled"];
var CATS=["Awareness","Incentives and business case","Governance and data rights","Identifiers and technical fit","Lock-in to existing systems","Regulation","Producer-country capacity","Funding","Rivalry between initiatives"];
var PROMPTS=["What would make you share data with other initiatives?","What would you need to tell your finance director?","Which meeting or reporting burden could we remove?","Where should the next pilot be?","Something else"];
var NEWSKINDS=["Regulation","Standards","Industry","Funding and calls"];
var FUNDING=["Funded","Partly funded","Seeking funding","Not known"];
var TABS=[["overview","Overview"],["map","Map"],["initiatives","Initiatives"],["progress","Progress and funding"],["hurdles","Hurdles"],["ideas","Ideas"],["regulation","Regulation"],["news","News"]];

var S={initiatives:[],hurdles:[],ideas:[],news:[],regs:[],votes:{},loaded:{},stale:false,
  db:null,user:null,me:null,canWrite:null,isAdmin:false,readOnly:false,noDb:false,
  f:{sector:new Set(),region:new Set(),commodity:new Set(),q:""},open:null,confirm:null,msg:{}};
var MAIN=document.getElementById("main");

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];});}
function arr(v){return Array.isArray(v)?v:[];}
function today(){var d=new Date();return new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));}
function pd(s){if(!s)return null;var m=/^(\d{4})-(\d{2})(?:-(\d{2}))?$/.exec(s);if(!m)return null;return m[3]?new Date(Date.UTC(+m[1],+m[2]-1,+m[3])):new Date(Date.UTC(+m[1],+m[2],0));}
var MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function fmt(s){var d=pd(s);if(!d)return esc(s||"");var hasDay=/^\d{4}-\d{2}-\d{2}$/.test(s);return (hasDay?d.getUTCDate()+" ":"")+MON[d.getUTCMonth()]+" "+d.getUTCFullYear();}
function daysTo(s){var d=pd(s);if(!d)return null;return Math.round((d-today())/864e5);}
function rel(n){if(n==null)return"";if(n===0)return"today";if(n>0){if(n<60)return"in "+n+" days";var m=Math.round(n/30.4);if(m<24)return"in "+m+" months";return"in "+Math.round(n/365)+" years";}var a=-n;if(a<60)return a+" days ago";var mm=Math.round(a/30.4);if(mm<24)return mm+" months ago";return Math.round(a/365)+" years ago";}

/* ---------- filters ---------- */
function hit(item){
  var f=S.f;
  function ok(set,vals){if(!set.size)return true;vals=arr(vals);if(!vals.length)return true;for(var i=0;i<vals.length;i++)if(set.has(vals[i]))return true;return false;}
  if(!ok(f.sector,item.sectors))return false;
  if(!ok(f.region,item.regions))return false;
  if(!ok(f.commodity,item.commodities))return false;
  if(f.q){var hay=JSON.stringify([item.name,item.title,item.text,item.summary,item.objectives,item.lead,item.detail,item.category,item.source,item.next,item.prompt,item.status,item.funders,item.lessons]).toLowerCase();if(hay.indexOf(f.q)<0)return false;}
  return true;
}
function anyFilter(){return S.f.sector.size||S.f.region.size||S.f.commodity.size||S.f.q;}
var FB={sector:[SECTORS,"fb-sector"],region:[REGIONS,"fb-region"],commodity:[COMMODITIES,"fb-commodity"]};
function renderFilterBar(){
  Object.keys(FB).forEach(function(k){var b=document.getElementById(FB[k][1]);var n=b.querySelector(".n");var c=S.f[k].size;n.hidden=!c;n.textContent=c;b.setAttribute("aria-expanded",S.open===k?"true":"false");});
  var p=document.getElementById("fpanel");
  if(!S.open){p.hidden=true;p.innerHTML="";}
  else{p.hidden=false;p.innerHTML=FB[S.open][0].map(function(v){return '<button class="chip" data-f="'+S.open+'" data-v="'+esc(v)+'" aria-pressed="'+(S.f[S.open].has(v)?"true":"false")+'">'+esc(v)+'</button>';}).join("");}
  document.getElementById("clearf").hidden=!anyFilter();
}
Object.keys(FB).forEach(function(k){document.getElementById(FB[k][1]).addEventListener("click",function(){S.open=S.open===k?null:k;renderFilterBar();});});
document.getElementById("fpanel").addEventListener("click",function(e){var b=e.target.closest(".chip");if(!b)return;var set=S.f[b.dataset.f];var v=b.dataset.v;if(set.has(v))set.delete(v);else set.add(v);renderFilterBar();render();});
var qT;document.getElementById("q").addEventListener("input",function(e){clearTimeout(qT);var v=e.target.value;qT=setTimeout(function(){S.f.q=v.trim().toLowerCase();renderFilterBar();render();},150);});
document.getElementById("clearf").addEventListener("click",function(){S.f.sector.clear();S.f.region.clear();S.f.commodity.clear();S.f.q="";document.getElementById("q").value="";S.open=null;renderFilterBar();render();});

/* ---------- tabs ---------- */
function tab(){var h=(location.hash||"").slice(1);for(var i=0;i<TABS.length;i++)if(TABS[i][0]===h)return h;return "overview";}
function counts(){return {initiatives:S.initiatives.filter(hit).length,hurdles:S.hurdles.filter(hit).length,ideas:S.ideas.filter(hit).length,regulation:S.regs.filter(hit).length,news:S.news.filter(hit).length};}
function renderTabs(){var t=tab(),c=counts();document.getElementById("tabs").innerHTML=TABS.map(function(x){var n=c[x[0]];return '<a href="#'+x[0]+'"'+(x[0]===t?' aria-current="page"':'')+'>'+x[1]+(n!=null&&S.loaded[x[0]==="regulation"?"regs":x[0]]?'<span class="ct">'+n+'</span>':'')+'</a>';}).join("");}
window.addEventListener("hashchange",function(){S.confirm=null;render();window.scrollTo(0,0);});

/* ---------- shared bits ---------- */
function tags(it){var out=[];arr(it.sectors).forEach(function(v){out.push(v);});arr(it.regions).forEach(function(v){out.push(v);});arr(it.commodities).forEach(function(v){out.push(v);});if(!out.length)return '<span class="t">All industries and regions</span>';return out.map(function(v){return '<span class="t">'+esc(v)+'</span>';}).join("");}
function who(uid){if(!uid)return "";if(uid==="curated")return '<span>Curated</span>';return '<span data-uid="'+esc(uid)+'">Someone</span>';}
async function fillNames(){if(!S.user)return;var els=MAIN.querySelectorAll("[data-uid]");if(!els.length)return;var ids=[];els.forEach(function(e){if(ids.indexOf(e.dataset.uid)<0)ids.push(e.dataset.uid);});try{var ps=await S.user.profiles(ids);els.forEach(function(e){var p=ps[e.dataset.uid];e.textContent=p&&p.isMe?"You":(p&&p.name)||"A participant";});}catch(_){}}
function canChange(it){if(S.readOnly||S.noDb)return false;return S.isAdmin||(S.me&&it.createdBy===S.me);}
function removeCtl(col,it){if(!canChange(it))return "";var key=col+"/"+it.id;if(S.confirm===key)return '<button class="lnk danger" data-act="del" data-col="'+col+'" data-id="'+esc(it.id)+'">Confirm remove</button> <button class="lnk" data-act="cancel">Keep</button>';return '<button class="lnk danger" data-act="askdel" data-key="'+esc(key)+'">Remove</button>';}
function seedPill(it){return it.example?'<span class="pill seed" title="Drafted from the working documents and public sources. Please correct or update.">Draft entry</span>':"";}
function emptyBox(txt){return '<div class="empty">'+txt+'</div>';}
function loadingOr(name,html){if(S.noDb)return emptyBox("Shared data is not available in this view. Open the hub from its link while signed in to see and add entries.");if(!S.loaded[name])return emptyBox("Loading shared entries…");return html;}
function tagPicker(name,legend,opts){return '<fieldset class="tagpick full"><legend>'+legend+'</legend><div class="opts">'+opts.map(function(v){return '<label class="chip" style="display:inline-flex;gap:5px;align-items:center"><input type="checkbox" name="'+name+'" value="'+esc(v)+'" style="width:auto;margin:0">'+esc(v)+'</label>';}).join("")+'</div></fieldset>';}
function tagPickerIds(name,legend,items){var s=items.slice().sort(byName);return '<fieldset class="tagpick full"><legend>'+legend+'</legend><div class="opts">'+s.map(function(it){return '<label class="chip" style="display:inline-flex;gap:5px;align-items:center"><input type="checkbox" name="'+name+'" value="'+esc(it.id)+'" style="width:auto;margin:0">'+esc(it.name)+'</label>';}).join("")+'</div></fieldset>';}
function byName(a,b){return String(a.name).localeCompare(String(b.name));}
function stageCls(s){return /Live|Scaled/.test(s)?"live":/Pilot/.test(s)?"pending":"proposed";}
function nameOf(id){var x=S.initiatives.find(function(i){return i.id===id;});return x?x.name:null;}
function usedBy(id){return S.initiatives.filter(function(x){return arr(x.buildsOn).indexOf(id)>=0;}).sort(byName);}
function fundPill(f){f=FUNDING.indexOf(f)>=0?f:"Not known";var c=f==="Funded"?"live":f==="Seeking funding"?"pending":f==="Partly funded"?"proposed":"seed";return '<span class="pill '+c+'">'+esc(f)+'</span>';}
function sel(name,opts,lab){return '<label>'+lab+'<select name="'+name+'" id="f-'+name+'">'+opts.map(function(o){return '<option>'+esc(o)+'</option>';}).join("")+'</select></label>';}
function writeNote(){if(S.snapshot)return '<p class="notice">This is a read-only snapshot of the hub, taken on 4 November 2026. Adding entries, updates and votes works in the live version.</p>';if(S.noDb)return '<p class="notice warn">Adding entries needs the shared store, which is not available in this view.</p>';if(S.readOnly)return '<p class="notice warn">You can read this hub but not add to it. Ask the owner for Contributor access.</p>';return "";}
function form(id,inner,cta){if(S.noDb||S.readOnly)return writeNote();return '<details class="add" id="d-'+id+'"'+(S.msg[id]&&S.msg[id].keep?' open':'')+'><summary>'+cta+'</summary><form class="f" id="'+id+'" novalidate>'+inner+'<div class="full actions"><button class="btn" type="submit">'+cta.replace(/^Add |^Share |^Post /,function(m){return m;})+'</button><span class="'+(S.msg[id]&&S.msg[id].err?"err":"ok")+'" aria-live="polite">'+esc(S.msg[id]?S.msg[id].text:"")+'</span></div></form></details>';}

/* ---------- views ---------- */
function regNext(r){var ms=arr(r.milestones).slice().sort(function(a,b){return a.date<b.date?-1:1;});var t=today();for(var i=0;i<ms.length;i++){var d=pd(ms[i].date);if(d&&d>=t)return ms[i];}return ms.length?ms[ms.length-1]:null;}
function allMilestones(list){var out=[];list.forEach(function(r){arr(r.milestones).forEach(function(m){out.push({date:m.date,label:m.label,reg:r});});});out.sort(function(a,b){var x=pd(a.date),y=pd(b.date);return (x?x-0:0)-(y?y-0:0);});return out;}
function voteCount(kind,id){var n=0;Object.keys(S.votes).forEach(function(u){var v=S.votes[u];if(v&&v[kind]&&v[kind][id])n++;});return n;}
function myVote(kind,id){var v=S.me&&S.votes[S.me];return !!(v&&v[kind]&&v[kind][id]);}
function voteBtn(kind,id){var n=voteCount(kind,id),mine=myVote(kind,id);var dis=S.readOnly||S.noDb||!S.me;return '<button class="vote" data-act="vote" data-kind="'+kind+'" data-id="'+esc(id)+'" aria-pressed="'+mine+'"'+(dis?' disabled title="'+(S.snapshot?"Voting works in the live version":"Voting needs Contributor access")+'"':'')+' aria-label="'+(mine?"Remove your vote":"Vote")+', '+n+' votes"><b>'+n+'</b><span>'+(mine?"voted":"vote")+'</span></button>';}

function vOverview(){
  var regs=S.regs.filter(hit),hs=S.hurdles.filter(hit),ns=S.news.filter(hit),ins=S.initiatives.filter(hit);
  var t=today();var ms=allMilestones(regs).filter(function(m){var d=pd(m.date);return d&&d>=t;}).slice(0,5);
  var top=hs.slice().sort(hrank).slice(0,4);
  var latest=ns.slice().sort(function(a,b){return a.date<b.date?1:-1;}).slice(0,4);
  var h='<div class="vhead"><div><h2>Overview</h2><p class="muted small">'+(anyFilter()?"Showing what matches your filters.":"Use the filters above to focus on an industry, region or commodity.")+'</p></div></div>';
  if(S.stale)h+='<p class="notice warn">Shared data can’t be reached right now. What you see may be out of date.</p>';
  h+='<div class="stats"><div class="stat"><b>'+ins.length+'</b><span>initiatives mapped</span></div><div class="stat"><b>'+hs.length+'</b><span>hurdles raised</span></div><div class="stat"><b>'+S.ideas.filter(hit).length+'</b><span>ideas shared</span></div><div class="stat"><b>'+regs.length+'</b><span>rules and standards tracked</span></div></div>';
  h+='<div class="grid2">';
  h+='<section class="panel"><div class="ph"><h3>Next regulatory dates</h3><a href="#regulation">All dates</a></div>'+loadingOr("regs",ms.length?'<div class="list">'+ms.map(function(m){var n=daysTo(m.date);return '<div class="item"><div class="when'+(n!=null&&n<=90?' soon':'')+'"><b>'+fmt(m.date)+'</b><span>'+rel(n)+'</span></div><div class="body"><span class="title">'+esc(m.reg.name)+'</span><span class="small">'+esc(m.label)+'</span></div></div>';}).join("")+'</div>':emptyBox("No upcoming dates match these filters."))+'</section>';
  h+='<section class="panel"><div class="ph"><h3>Top hurdles</h3><a href="#hurdles">Vote on hurdles</a></div>'+loadingOr("hurdles",top.length?'<div class="list">'+top.map(function(x){return '<div class="item">'+voteBtn("h",x.id)+'<div class="body"><span class="title">'+esc(x.title)+'</span><div class="meta"><span>'+esc(x.category)+'</span>'+pollTag(x)+'</div></div></div>';}).join("")+'</div>':emptyBox("No hurdles yet. Be the first to raise one."))+'</section>';
  h+='<section class="panel"><div class="ph"><h3>Latest news</h3><a href="#news">All news</a></div>'+loadingOr("news",latest.length?'<div class="list">'+latest.map(newsRow).join("")+'</div>':emptyBox("No news matches these filters."))+'</section>';
  h+='<section class="panel"><div class="ph"><h3>How to take part</h3></div><ol class="small" style="margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px"><li><a href="#initiatives">Check your initiative’s entry</a> and correct or add to it.</li><li><a href="#hurdles">Vote on the hurdles</a> that block you most, or raise a new one.</li><li><a href="#ideas">Answer a prompt</a>, such as what would make you share data.</li><li><a href="#news">Share news</a> others should see.</li><li>See the <a href="#map">map</a> of themes, communities and who is working on what.</li><li>Funders: <a href="#progress">see what is funded</a>, how work builds on earlier work, and where the gaps are.</li></ol><p class="small muted">Contribute when it suits you. The steering group reviews the hub before each meeting and reports back on what changed.</p></section>';
  h+='</div>';
  return h;
}

function vInitiatives(){
  var list=S.initiatives.filter(hit).sort(function(a,b){return String(a.name).localeCompare(String(b.name));});
  var h='<div class="vhead"><div><h2>Initiatives</h2><p class="muted small">Standards, platforms, national systems, pilots and convening bodies working on interoperable supply-chain data. Entries marked “Draft entry” were drafted from the working documents and public sources: please correct them.</p></div></div>';

var THEMES=["Technical standards","Governance practices","Verification and assurance","Incentive structures","Privacy and trust","Participation in governance"];

var CAT2THEME={"Identifiers and technical fit":"Technical standards","Lock-in to existing systems":"Technical standards","Governance and data rights":"Privacy and trust","Rivalry between initiatives":"Governance practices","Regulation":"Verification and assurance","Incentives and business case":"Incentive structures","Funding":"Incentive structures","Awareness":"Participation in governance","Producer-country capacity":"Participation in governance"};

var INTERESTS=[["benefits","Benefits","What participants gain: lower costs, market access, simpler compliance."],["trust","Trust and data governance","Confidence that shared data is safe, fairly governed and used as agreed."],["align","Alignment and meaning","Seeing how each effort fits the bigger picture, and builds on others."]];

function hv(h){return voteCount("h",h.id);}
function ps(h){return (h.poll&&h.poll.score)||0;}
function hrank(a,b){return hv(b)-hv(a)||ps(b)-ps(a)||String(a.title).localeCompare(String(b.title));}

function subscribe(name,col){
  var timer=setTimeout(function(){if(!S.loaded[name]){S.stale=true;S.loaded[name]=true;render();}},10000);
  S.db.collection(col).onSnapshot(function(snap){
    var out=[];snap.docs.forEach(function(d){var x=Object.assign({id:d.id},d.data());out.push(x);});
    if(name==="votes"){var m={};out.forEach(function(x){m[x.id]=x;});S.votes=m;}else S[name]=out;
    if(!snap.metadata.fromCache){clearTimeout(timer);S.stale=false;}
    S.loaded[name]=true;render();
  },function(err){clearTimeout(timer);S.loaded[name]=true;S.stale=true;render();});
}
